[project]
name = "doctrans"
version = "0.1.0"
description = "本地批量翻译长篇 PDF（书、手册）为中文，并按原书版式重排"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = ["pymupdf>=1.24", "markdown>=3.5", "weasyprint>=62"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
doctrans = "doctrans.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["doctrans"]

[tool.setuptools.package-data]
doctrans = ["*.css"]
